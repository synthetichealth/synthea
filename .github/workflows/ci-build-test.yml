on: [push, pull_request]

permissions:
  contents: read

jobs:
  check_java_latest:
    runs-on: ubuntu-latest
    name: Java 25
    
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: 25
          distribution: 'zulu'

      - name: Gradle cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-jdk25-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-jdk25
            
      - name: Compile with Gradle
        run: ./gradlew assemble
  
  check_java_minimum:
    runs-on: ubuntu-latest
    name: Java 17
    
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Gradle cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-jdk17-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-jdk17
            
      - name: Compile with Gradle
        run: ./gradlew assemble
  
      - name: Test
        id: tests
        run: ./gradlew check
  
      - name: Summarize test results
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' && hashFiles('build/test-results/test/TEST-*.xml') != '' }}
        uses: test-summary/action@37b508cfee6d4d080eedd00b5bb240a6a784a6a5 # v2.6
        with:
          paths: build/test-results/test/TEST-*.xml
          show: fail
          folded: true

      - name: Upload test reports
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-java-17
          path: |
            build/reports/tests/test/
            build/test-results/test/TEST-*.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Code coverage
        uses: codecov/codecov-action@v3

